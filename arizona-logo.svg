<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1800" viewBox="0 0 3000 1800">
  <defs>
    <linearGradient id="gold" x1="0" x2="1">
      <stop offset="0%" stop-color="#8A5100"/>
      <stop offset="45%" stop-color="#D89A24"/>
      <stop offset="100%" stop-color="#9A5A00"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="3000" height="1800" fill="#FFFFFF"/>

  <!-- Main logo wordmark -->
  <g filter="url(#shadow)" fill="#202124">
    <text x="1500" y="690"
          text-anchor="middle"
          font-family="Arial, Helvetica, sans-serif"
          font-size="390"
          font-weight="900"
          letter-spacing="18">ARIZONA</text>
  </g>

  <!-- Gold accents inside first and last A -->
  <path d="M235 680 L315 680 L275 575 Z" fill="url(#gold)"/>
  <path d="M2695 680 L2775 680 L2735 575 Z" fill="url(#gold)"/>

  <!-- Premium gold underline -->
  <path d="M380 835
           C800 750 1250 760 1700 810
           C2050 850 2400 850 2620 760
           C2450 900 2050 965 1650 950
           C1150 930 750 880 380 865 Z"
        fill="url(#gold)"/>

  <!-- Furniture -->
  <text x="1500" y="1145"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="170"
        font-weight="700"
        letter-spacing="62"
        fill="#202124">FURNITURE</text>

  <!-- Tagline -->
  <g font-family="Arial, Helvetica, sans-serif"
     font-size="60"
     font-weight="700"
     letter-spacing="16"
     fill="#202124"
     text-anchor="middle">
    <text x="470" y="1365">STYLE</text>
    <text x="1030" y="1365">COMFORT</text>
    <text x="1700" y="1365">QUALITY</text>
    <text x="2370" y="1365">LIFESTYLE</text>
  </g>

  <!-- Gold separators -->
  <g stroke="#B87810" stroke-width="8">
    <line x1="700" y1="1310" x2="700" y2="1380"/>
    <line x1="1360" y1="1310" x2="1360" y2="1380"/>
    <line x1="2035" y1="1310" x2="2035" y2="1380"/>
  </g>
</svg>